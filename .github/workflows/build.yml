# Tests every push and pull request; on the branches below it also builds
# the APK and uploads it as the run's artifact. Android is the only target
# this fork builds.
#
# Failures are annotated: a test's text and a compiler's errors live in the
# run log, which cannot be read without a sign-in, so the steps repeat them
# as annotations.
name: Build

on:
  push:
    branches: [main, ir-core]
    paths-ignore: ['**.md', 'docs/images/**', 'docs/screenshots/**', 'docs/readme/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/images/**', 'docs/screenshots/**', 'docs/readme/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The app reads .github/updates.json from the default branch as soon
      # as it is pushed (app/lib/app_info.dart): the version it offers.
      - name: Update notice
        run: |
          jq -e 'type == "object"
            and has("android")
            and all(.[]; type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' .github/updates.json >/dev/null || {
            echo "::error::updates.json must name android with a \"major.minor.patch\" version"
            exit 1
          }
          v="${{ steps.version.outputs.version }}"
          ahead="$(jq -r --arg v "$v" '($v | split(".") | map(tonumber)) as $app
            | to_entries[] | select((.value | split(".") | map(tonumber)) > $app) | "\(.key) \(.value)"' .github/updates.json | xargs)"
          if [ -n "$ahead" ]; then
            echo "::error::updates.json names a version newer than app/pubspec.yaml ($v): $ahead"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: App
        working-directory: app
        run: |
          flutter pub get
          # The analyzer's issues go to the log too.
          flutter analyze > analyze.log 2>&1 || {
            grep -E '^ *(error|warning|info) ' analyze.log | head -80 \
              | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          tail -n 3 analyze.log
          # A failing test's text lives only in the run log; the json
          # reporter's events are turned into annotations here.
          flutter test --reporter=json > test.json 2>&1 || true
          node - test.json <<'EOF'
          const fs = require('fs');
          const lines = fs.readFileSync(process.argv[2], 'utf8').split('\n');
          const names = new Map();
          const errs = [];
          const tail = [];
          let events = 0;
          for (const l of lines) {
            if (!l.startsWith('{')) {
              if (l.trim()) { tail.push(l); if (tail.length > 60) tail.shift(); }
              continue;
            }
            let e;
            try { e = JSON.parse(l); } catch { continue; }
            events++;
            if (e.type === 'testStart') names.set(e.test.id, e.test.name);
            if (e.type === 'print') { tail.push(e.message); if (tail.length > 60) tail.shift(); }
            if (e.type === 'error') {
              // The framework reports a build or layout error as "Test failed. See exception
              // logs above."; the "above" is this tail.
              errs.push({
                name: names.get(e.testID) || '?',
                msg: [e.error, e.stackTrace || '', '--- output before it ---', ...tail].join('\n'),
              });
            }
          }
          if (!events) {
            console.log('::error::the test run produced no json events');
            process.exit(1);
          }
          for (const x of errs) {
            const m = (x.name + ' — ' + x.msg).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 6000);
            console.log('::error::' + m);
          }
          process.exit(errs.length ? 1 : 0);
          EOF

  android:
    needs: test
    if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/ir-core' || github.ref == 'refs/heads/main') && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'android'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # blobgate's C sources are built by the project's ndkBuild.
      - name: NDK
        run: |
          ndk="$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no release key: the APKs are signed with a debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > app/android/release.jks
          printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > app/android/key.properties
      - name: Build
        run: |
          # A compiler error's text is only in the run log; the lines that
          # name one are repeated as annotations here.
          set +e
          {
          v='${{ needs.test.outputs.version }}'
          cd app
          flutter pub get
          mkdir -p ../out
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=$v
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../out/Arman-VPN-Android-$abi.apk"
          done
          flutter build apk --release --dart-define=APP_VERSION=$v
          cp build/app/outputs/flutter-apk/app-release.apk ../out/Arman-VPN-Android-universal.apk
          # One zip with the per-ABI APKs, for handing a phone the right file.
          (cd ../out && zip -9 -q Arman-VPN-Android-apks.zip \
            Arman-VPN-Android-arm64-v8a.apk \
            Arman-VPN-Android-armeabi-v7a.apk \
            Arman-VPN-Android-x86_64.apk)
          } 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E '^(e: |w: )|error:|^FAILURE: |^> Task .* FAILED|^Execution failed|Caused by:|^> ' build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
          # R8 and the packaging steps name their failure in a block no single
          # line matches; the end of the build says it.
          if [ "$status" -ne 0 ]; then
            tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: Remove the key
        if: always()
        run: rm -f app/android/release.jks app/android/key.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error
