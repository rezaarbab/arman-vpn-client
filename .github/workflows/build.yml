# Tests every push and pull request; on the branches below it also builds
# the APK and uploads it as the run's artifact. Android is the only target
# this fork builds.
#
# Failures are annotated: a test's text and a compiler's errors live in the
# run log, which cannot be read without a sign-in, so the steps repeat them
# as annotations.
name: Build

on:
  push:
    branches: [main, ir-core]
    paths-ignore: ['**.md', 'docs/images/**', 'docs/screenshots/**', 'docs/readme/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/images/**', 'docs/screenshots/**', 'docs/readme/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  android:
    if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/ir-core' || github.ref == 'refs/heads/main') && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'android'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # blobgate's C sources are built by the project's ndkBuild.
      - name: NDK
        run: |
          ndk="$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no release key: the APKs are signed with a debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > app/android/release.jks
          printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > app/android/key.properties
      - name: Analyze the Dart
        # The release build says only "the flutter process exited 1": the Dart
        # compiler's own words go into a Gradle log the run page does not show
        # without a token, so a bad line of Dart has been costing three cycles
        # of guessing. The analyzer names the file, the line and the reason,
        # and those become annotations here. It does not decide the job: a
        # warning-level complaint must not stop an APK, and the build step is
        # the one that judges the code.
        continue-on-error: true
        run: |
          ( cd app && flutter pub get ) > /dev/null 2>&1
          ( cd app && flutter analyze --no-pub ) 2>&1 | tee analyze.log
          grep -E '^[[:space:]]+(error|warning)' analyze.log | head -n 30 \
            | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::[dart]$(echo "$line" | sed 's/^ *//')"; done
          exit 0
      - name: Build
        run: |
          # A compiler error's text is only in the run log; the lines that
          # name one are repeated as annotations here.
          set +e
          # The build as one thing that can be asked twice.
          do_build() {
          v="$(awk -F'[ .+]' '/^version:/ {print $2"."$3"."$4; exit}' app/pubspec.yaml)"
          ( cd app
          flutter pub get
          mkdir -p ../out
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=$v --dart-define=APP_COMMIT=${GITHUB_SHA::7}
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../out/Blob-VPN-Android-$abi.apk"
          done
          flutter build apk --release --dart-define=APP_VERSION=$v --dart-define=APP_COMMIT=${GITHUB_SHA::7}
          cp build/app/outputs/flutter-apk/app-release.apk ../out/Blob-VPN-Android-universal.apk
          # One zip with the per-ABI APKs, for handing a phone the right file.
          ( cd ../out && zip -9 -q Blob-VPN-Android-apks.zip \
            Blob-VPN-Android-arm64-v8a.apk \
            Blob-VPN-Android-armeabi-v7a.apk \
            Blob-VPN-Android-x86_64.apk)
          )
          }
          do_build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # ':gradle' refusing to configure is this runner's own flake: it names no
          # file and no line of ours, and it has cost a finished build before. It
          # is asked once more, and only when that refusal is all the log says.
          if [ "$status" -ne 0 ] && grep -qE "configuring project ':gradle'|Could not (resolve|download|create)" build.log \
             && ! grep -qE '^e: |^error:|Error: |^lib/|^test/' build.log; then
            echo "::notice::the build system itself refused to start; building once more"
            rm -f build.log
            do_build 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
          fi
          # The lines that name a compiler error, and the block under "What went
          # wrong" - a configure failure says its real reason only there, and
          # without it the job reads as a mystery.
          sed -n '/\* What went wrong:/,/^\* Try:/p' build.log | head -40 \
            | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
          grep -E '^(e: |w: )|error:|Error: |^FAILURE: |^> Task .* FAILED|^Execution failed|Caused by:|^> |^lib/|^test/' build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
          # R8 and the packaging steps name their failure in a block no single
          # line matches; the end of the build says it.
          if [ "$status" -ne 0 ]; then
            # One annotation per line, not one giant line: GitHub drops an
            # annotation whose message runs long, and joining the tail into a
            # single %0A blob is exactly that - the reason a failed Dart build
            # has been readable only as Gradle's four summary lines.
            awk '/^FAILURE: Build/ {f=1} f' build.log | head -n 25 \
              | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::[why] $line"; done
            tail -n 20 build.log | sed 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error::[tail] $line"; done
            # The annotations only carry what a grep pattern already expects, and
            # a Dart error the flutter tool prints in its own shape disappears
            # behind Gradle's summary. The job page is readable without a token,
            # so the compiler's own lines go there too: the file, the line, the
            # words - which is the difference between fixing something and
            # guessing at it three times.
            {
              echo "### what the compiler actually said"
              echo ""
              echo '```'
              grep -nE "Error: |error:|^\s+[0-9]+.*expected|\.dart:[0-9]+:[0-9]+" build.log | head -n 50
              echo "--- the 40 lines before the first failure ---"
              grep -nE "^> Task .*FAILED|Error: |Execution failed" build.log | head -n 3
              awk '/Error: |^> Task .*FAILED/{f=1} f{print} END{}' build.log | head -n 60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Remove the key
        if: always()
        run: rm -f app/android/release.jks app/android/key.properties
      # One entry per CPU, so the run page hands out the right file on its own;
      # the zip holds all three splits for one download.
      - name: Artifact arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: Blob-VPN-Android-arm64-v8a
          path: out/Blob-VPN-Android-arm64-v8a.apk
          if-no-files-found: error
      - name: Artifact armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          name: Blob-VPN-Android-armeabi-v7a
          path: out/Blob-VPN-Android-armeabi-v7a.apk
          if-no-files-found: error
      - name: Artifact x86_64
        uses: actions/upload-artifact@v7
        with:
          name: Blob-VPN-Android-x86_64
          path: out/Blob-VPN-Android-x86_64.apk
          if-no-files-found: error
      - name: Artifact universal
        uses: actions/upload-artifact@v7
        with:
          name: Blob-VPN-Android-universal
          path: out/Blob-VPN-Android-universal.apk
          if-no-files-found: error
      - name: Artifact all three in one zip
        uses: actions/upload-artifact@v7
        with:
          name: Blob-VPN-Android-apks
          path: out/Blob-VPN-Android-apks.zip
          if-no-files-found: error
